<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PLFM: a calendar for programming languages and formal methods">
  <rect width="1200" height="630" fill="#fcfcfb" />

  <!-- The favicon glyph, so the thumbnail and the browser tab read as one mark. -->
  <g transform="translate(90 162) scale(2)">
    <rect x="3" y="6" width="26" height="23" rx="2" fill="none" stroke="#17171a" stroke-width="2" />
    <rect x="3" y="6" width="26" height="5" rx="2" fill="#17171a" />
    <rect x="8" y="16" width="5" height="4" rx="1" fill="#17171a" />
    <rect x="16" y="16" width="5" height="4" rx="1" fill="#2a5cb8" />
    <rect x="8" y="23" width="5" height="4" rx="1" fill="#17171a" />
    <rect x="16" y="23" width="5" height="4" rx="1" fill="#17171a" />
  </g>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="96" y="334" font-size="104" font-weight="600" letter-spacing="-3" fill="#17171a">PLFM</text>
    <text x="96" y="402" font-size="33" fill="#5f5f68">Conferences, workshops, schools, and events in</text>
    <text x="96" y="446" font-size="33" fill="#5f5f68">programming languages and formal methods.</text>
  </g>
</svg>
