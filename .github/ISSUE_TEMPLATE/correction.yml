name: Report a correction
description: A date, link, or detail on the site that is wrong or out of date.
title: 'Correction: '
labels: [correction]
body:
  - type: markdown
    attributes:
      value: |
        If the site disagrees with the official page, the official page is
        right. Corrections are as welcome as new entries.

  - type: input
    id: entry
    attributes:
      label: Which entry
      description: The acronym, name, or the id shown in the entry's detail panel.
      placeholder: POPL 2027
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      placeholder: The paper deadline moved to 16 July.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Official page that shows the correct information
      placeholder: https://example.org/popl-2027/call-for-papers
    validations:
      required: true
