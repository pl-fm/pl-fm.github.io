name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Data and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Reports every problem in data/ at once, and fails on any of them.
      - name: Check data files
        run: npm run validate

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build
